<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A bilingual (English / Bahasa Melayu) learning portal: AWS cloud from zero to architect, and an AI engineering track from tensors to your own GPT.">
<title>AWS Architect Path</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: enterprise training portal. Navy app bar on top, module index on the left, a document column of bordered sections, and an "On this page" outline on wide screens. */
:root{
  --paper:#F3F5F8; --surface:#FFFFFF; --sunk:#EEF1F5; --ink:#152033; --muted:#596579; --line:#D8DEE6; --line-strong:#C3CBD6;
  --accent:#1B5FCC; --accent-ink:#FFFFFF; --accent-soft:#E8F0FC; --pulse:#E39B12;
  --navy:#0F1B2D; --navy-2:#17263D; --navy-ink:#E8EDF4; --navy-muted:#97A6BB;
  --good:#1D7F45; --good-soft:#E3F2E9; --bad:#B8322A; --bad-soft:#F9E5E3; --warn:#9A6400;
  --code-bg:#0F1A24; --code-fg:#D6E2EE; --code-dim:#7F93A8;
  --k-user:#5D6B7C; --k-edge:#6B4FC8; --k-net:#2361C7; --k-compute:#C2620A; --k-data:#1A7F52;
  --k-sec:#B8322A; --k-int:#A2307E; --k-ops:#0B7480; --k-ai:#7C6200; --k-allow:#1D7F45; --k-deny:#B8322A;
  --display:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius:6px; --bar-h:56px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D131B; --surface:#141C27; --sunk:#1A2431; --ink:#E2E8F0; --muted:#94A2B5; --line:#283444; --line-strong:#364457;
  --accent:#5B96F0; --accent-ink:#071526; --accent-soft:#16263E; --pulse:#F2B33D;
  --navy:#09101A; --navy-2:#111C2B; --navy-ink:#E2E8F0; --navy-muted:#8796AB;
  --good:#4CBF80; --good-soft:#112B1D; --bad:#EE746B; --bad-soft:#371A17; --warn:#E8B04A;
  --code-bg:#0A1017; --code-fg:#D6E2EE; --code-dim:#7F93A8;
  --k-user:#9AA7B6; --k-edge:#A68CEE; --k-net:#6E9EF0; --k-compute:#EE9643; --k-data:#47BB84;
  --k-sec:#EE746B; --k-int:#DD6EB5; --k-ops:#41B7C4; --k-ai:#D4B23F; --k-allow:#4CBF80; --k-deny:#EE746B;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0D131B; --surface:#141C27; --sunk:#1A2431; --ink:#E2E8F0; --muted:#94A2B5; --line:#283444; --line-strong:#364457;
  --accent:#5B96F0; --accent-ink:#071526; --accent-soft:#16263E; --pulse:#F2B33D;
  --navy:#09101A; --navy-2:#111C2B; --navy-ink:#E2E8F0; --navy-muted:#8796AB;
  --good:#4CBF80; --good-soft:#112B1D; --bad:#EE746B; --bad-soft:#371A17; --warn:#E8B04A;
  --code-bg:#0A1017; --code-fg:#D6E2EE; --code-dim:#7F93A8;
  --k-user:#9AA7B6; --k-edge:#A68CEE; --k-net:#6E9EF0; --k-compute:#EE9643; --k-data:#47BB84;
  --k-sec:#EE746B; --k-int:#DD6EB5; --k-ops:#41B7C4; --k-ai:#D4B23F; --k-allow:#4CBF80; --k-deny:#EE746B;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font:15.5px/1.65 var(--body);-webkit-text-size-adjust:100%}
a{color:var(--accent)}
code{font-family:var(--mono);font-size:.86em;background:var(--sunk);padding:.08em .35em;border-radius:4px;overflow-wrap:anywhere}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0;font-weight:600;letter-spacing:-.01em}
.eyebrow{font:600 11.5px/1.3 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
[hidden]{display:none!important}

/* ---------- app bar ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--navy)}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--navy);color:var(--navy-ink);border-bottom:1px solid #00000040}
.appbar-in{height:var(--bar-h);display:flex;align-items:center;gap:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--navy-ink);flex:none}
.brand-mark{width:28px;height:28px;flex:none}
.brand b{font:600 15px/1.1 var(--display);display:block;letter-spacing:.01em}
.brand small{font:500 11px var(--body);color:var(--navy-muted)}
.trackbar{display:flex;align-self:stretch}
.trackbar a{display:flex;align-items:center;padding:0 14px;color:var(--navy-muted);text-decoration:none;font-weight:500;font-size:14px;border-bottom:3px solid transparent;border-top:3px solid transparent}
.trackbar a:hover{color:var(--navy-ink)}
.trackbar a.on{color:#fff;border-bottom-color:var(--accent)}
.appbar-r{margin-left:auto;display:flex;align-items:center;gap:16px}
.meter{display:flex;align-items:center;gap:10px;font:500 12px var(--body);color:var(--navy-muted);font-variant-numeric:tabular-nums}
.meter .bar{width:120px;height:6px;background:var(--navy-2);border-radius:99px;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s}
.glink{color:var(--navy-ink);text-decoration:none;font-size:14px;font-weight:500}
.glink:hover{text-decoration:underline}
.lang{display:inline-flex;border:1px solid #ffffff2e;border-radius:var(--radius);overflow:hidden;flex:none}
.lang button{border:0;background:transparent;padding:4px 10px;cursor:pointer;font:600 12px var(--body);color:var(--navy-muted)}
.lang button[aria-pressed="true"]{background:var(--accent);color:#fff}
.menu-btn{display:none;border:1px solid #ffffff2e;background:transparent;color:var(--navy-ink);border-radius:var(--radius);padding:6px 8px;cursor:pointer;flex:none}
.menu-btn svg{display:block}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:calc(100vh - var(--bar-h))}
.side{position:sticky;top:calc(var(--bar-h) + env(safe-area-inset-top,0px));height:calc(100vh - var(--bar-h) - env(safe-area-inset-top,0px));overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);
  padding-block:18px 32px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:14px}
.side-h{font:600 11.5px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 8px}
.nav{display:grid;gap:16px}
.nav-phase{display:grid;gap:1px}
.nav-phase h4{margin:0 0 4px;padding:0 8px;font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.nav a{display:grid;grid-template-columns:34px 1fr 12px;align-items:center;gap:6px;padding:6px 8px;border-radius:4px;text-decoration:none;color:var(--ink);font-size:13.5px;line-height:1.3;border-left:3px solid transparent}
.nav a:hover{background:var(--sunk)}
.nav a.on{background:var(--accent-soft);border-left-color:var(--accent);font-weight:600}
.nav .num{font:500 11.5px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.nav .tick{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line-strong)}
.nav .tick.done{background:var(--good);border-color:var(--good)}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);line-height:1.5;padding:0 8px}
.scrim{display:none}
main{min-width:0;padding-block:32px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:40px;max-width:1240px;margin:0 auto}
.wrap{max-width:960px;width:100%;margin:0 auto;display:grid;gap:28px;min-width:0}
.toc{display:none}
@media (min-width:1360px){
  .layout{grid-template-columns:minmax(0,960px) 200px;justify-content:center}
  .toc{display:block;position:sticky;top:calc(var(--bar-h) + 28px);align-self:start;font-size:13px;max-height:calc(100vh - var(--bar-h) - 56px);overflow:auto}
  .toc b{display:block;font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .toc a{display:block;padding:4px 0 4px 12px;color:var(--muted);text-decoration:none;border-left:2px solid var(--line);line-height:1.35}
  .toc a:hover{color:var(--ink)}
  .toc a.on{color:var(--accent);border-left-color:var(--accent);font-weight:500}
}
@media (max-width:1100px){ .meter{display:none} }
@media (max-width:920px){
  .app{grid-template-columns:minmax(0,1fr)}
  .menu-btn{display:block}
  .appbar-in{gap:10px}
  .brand small,.glink{display:none}
  .trackbar a{padding:0 10px;font-size:13.5px}
  .side{position:fixed;z-index:40;top:0;left:0;bottom:0;width:min(320px,86vw);height:100%;transform:translateX(-102%);transition:transform .25s ease;
    padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:0 10px 40px rgba(0,0,0,.3)}
  .scrim.open{display:block;position:fixed;inset:0;z-index:35;background:rgba(5,10,15,.5)}
  main{padding-top:20px}
}
@media (max-width:520px){ .brand > span{display:none} .trackbar a{padding:0 9px;font-size:13px} .appbar-r{gap:8px} }

/* ---------- shared blocks ---------- */
.sec{display:grid;gap:14px;min-width:0;scroll-margin-top:calc(var(--bar-h) + 16px)}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sec-head h2{font-size:21px}
.lede{font-size:16.5px;color:var(--muted);max-width:70ch;margin:0}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:var(--radius);padding:9px 16px;cursor:pointer;text-decoration:none;font-weight:500;font-size:14px;line-height:1.3;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.done{background:var(--good-soft);border-color:var(--good);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{font:500 12px var(--body);padding:2px 9px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;background:var(--surface)}
.term{border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;cursor:help;text-decoration:underline dotted var(--accent);text-decoration-thickness:1.5px;text-underline-offset:3px}
.term:hover{color:var(--accent)}
.note{font-size:13.5px;color:var(--muted);margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}

/* ---------- overview ---------- */
.hero{display:grid;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px 28px 24px;border-top:4px solid var(--accent)}
.hero h1{font-size:clamp(28px,4.4vw,40px);font-weight:600}
.hero h1 em{font-style:normal;color:var(--accent)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.facts div{padding:12px 16px;display:grid;gap:0;border-right:1px solid var(--line)}
.facts div:last-child{border-right:0}
.facts b{font:600 24px var(--display);font-variant-numeric:tabular-nums}
.facts span{font-size:12.5px;color:var(--muted)}
@media (max-width:640px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))} .facts div:nth-child(2){border-right:0} .facts div:nth-child(-n+2){border-bottom:1px solid var(--line)} .hero{padding:20px 18px}}
.newcomer,.aibanner{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--radius);padding:16px 20px;display:grid;gap:8px}
.newcomer h2{font-size:17px}
.newcomer ol{margin:0;padding-left:22px;display:grid;gap:5px;font-size:14.5px}
.aibanner{text-decoration:none;color:var(--ink);transition:border-color .15s}
.aibanner:hover{border-color:var(--accent)}
.aibanner span:not(.eyebrow){font-size:15px}
.aibanner b{font-weight:600;color:var(--accent)}
.loop{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);counter-reset:step}
.loop div{padding:14px 16px;display:grid;gap:4px;align-content:start;border-right:1px solid var(--line);counter-increment:step}
.loop div:last-child{border-right:0}
.loop b{font-weight:600;font-size:14.5px}
.loop b::before{content:counter(step,decimal-leading-zero) "  ";font:500 12px var(--mono);color:var(--accent)}
.loop span{font-size:13px;color:var(--muted)}
@media (max-width:860px){.loop{grid-template-columns:minmax(0,1fr)} .loop div{border-right:0;border-bottom:1px solid var(--line)} .loop div:last-child{border-bottom:0}}
.phases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.phases{grid-template-columns:minmax(0,1fr)}}
.phase{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);display:grid;align-content:start;min-width:0;overflow:hidden}
.phase.zero{grid-column:1/-1}
.phase.zero ol{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.phase header{display:grid;gap:4px;padding:14px 16px;background:var(--sunk);border-bottom:1px solid var(--line)}
.phase h3{font-size:16.5px}
.phase p{margin:0;font-size:13px;color:var(--muted)}
.phase ol{list-style:none;margin:0;padding:6px;display:grid;gap:1px}
.phase li a{display:grid;grid-template-columns:38px 1fr auto;gap:6px;align-items:center;text-decoration:none;color:var(--ink);font-size:13.5px;padding:7px 8px;border-radius:4px;line-height:1.3}
.phase li a:hover{background:var(--accent-soft)}
.phase li .num{font:500 11.5px var(--mono);color:var(--muted)}
.phase li .h{font:500 11.5px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.phase li a.done .num{color:var(--good)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11.5px var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--sunk);white-space:nowrap}
tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
tr:last-child td{border-bottom:0}
td.c{text-align:center}
@media (max-width:640px){table{font-size:13px} th,td{padding:8px 10px} .tbl-wrap table{min-width:560px}}
.pip{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.pip.lo{background:transparent;border:1.5px solid var(--accent)}

.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.two{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:grid;gap:8px;align-content:start;min-width:0}
.panel h3{font-size:16px}
.panel ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px}

/* ---------- module page ---------- */
.mhead{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px 20px;border-top:4px solid var(--accent)}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px;color:var(--muted)}
.crumbs span+span::before{content:"/";margin-right:6px;color:var(--line-strong)}
.mhead h1{font-size:clamp(26px,3.8vw,34px)}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);padding-top:10px;border-top:1px solid var(--line)}
.meta b{color:var(--ink);font-weight:600}
@media (max-width:520px){.mhead{padding:18px 16px}}
.plainbox{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--k-ops);border-radius:var(--radius);overflow:hidden}
.plainbox > div{padding:16px 20px;display:grid;gap:8px;align-content:start}
.plainbox > div + div{border-left:1px solid var(--line);background:var(--sunk)}
.plainbox .eyebrow{color:var(--k-ops)}
.plainbox p{margin:0;font-size:15px}
.plainbox .analogy p{font-size:16px;line-height:1.6}
.plainbox .whyline{padding-top:10px;border-top:1px solid var(--line);display:grid;gap:6px}
@media (max-width:760px){.plainbox{grid-template-columns:minmax(0,1fr)} .plainbox > div + div{border-left:0;border-top:1px solid var(--line)}}
.outcomes{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 24px}
@media (max-width:640px){.outcomes{grid-template-columns:minmax(0,1fr)}}
.outcomes li{position:relative;padding-left:24px;font-size:14.5px}
.outcomes li::before{content:"";position:absolute;left:2px;top:.42em;width:12px;height:12px;border-radius:2px;background:var(--accent-soft);border:1.5px solid var(--accent)}
.outcomes li::after{content:"";position:absolute;left:6px;top:.62em;width:3px;height:6px;border:solid var(--accent);border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.concepts{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.concept{background:var(--surface);padding:14px 16px;display:grid;gap:4px;align-content:start;min-width:0}
.concept b{font-weight:600;font-size:14.5px}
.concept p{margin:0;font-size:13.5px;color:var(--muted)}

/* diagram console */
.dia{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:grid;min-width:0}
.dia-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--sunk)}
.dia-top b{font-weight:600;font-size:14.5px}
.ctrls{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.ctrls button{border:1px solid var(--line-strong);background:var(--surface);border-radius:4px;padding:5px 10px;cursor:pointer;font-size:13px;min-width:34px;min-height:32px}
.ctrls button:hover{border-color:var(--accent)}
.ctrls button.play{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.ctrls .pill{font:500 12px var(--mono);font-variant-numeric:tabular-nums}
.ctrls .pill.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.ctrls .spd{font:500 12px var(--mono)}
.timeline{height:3px;background:var(--line)}
.timeline i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s ease}
.dia-svg{overflow-x:auto;background:var(--paper);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:20px 20px;-webkit-overflow-scrolling:touch}
.dia-svg svg{display:block;width:100%;min-width:640px;height:auto}
.swipe{display:none;font-size:12px;color:var(--muted);padding:6px 14px 0;margin:0}
@media (max-width:700px){.swipe{display:block}}
.dia-cap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding:14px;border-top:1px solid var(--line);align-items:start;min-height:80px}
.dia-cap .n{font:600 12px var(--mono);color:var(--accent);padding-top:3px;white-space:nowrap;font-variant-numeric:tabular-nums}
.dia-cap p{margin:0;font-size:15px}
.dia-info{margin:0;padding:8px 14px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}
.dia-info b{color:var(--ink)}

const C = window.COURSE;

const cloudMods = C.phase0.concat(C.modules);
const CLF = {m01:2,m02:1,m03:1,m04:1,m05:1,m06:1,m14:1,m16:2,m19:1};
cloudMods.forEach(m=>{ m.track='cloud'; const b=C.beginner[m.id]; if(b) Object.assign(m,b); if(CLF[m.id]) m.certs=Object.assign({CLF:CLF[m.id]},m.certs); });

if(C.cloudCalcs) cloudMods.forEach(m=>{ if(C.cloudCalcs[m.id]) m.calc=C.cloudCalcs[m.id]; });
const aiMods = C.aiModules || [];
const TR = {
  cloud:{ mods:cloudMods, phases:C.phases, cap:'capstone', capData:C.capstone, home:'overview' },

};
const byId = {};

/* ---------- glossary linking (scoped per track) ---------- */
const GL = C.glossary;
GL.forEach((e,i)=>e.i=i);
function buildLinker(track){
  const map=new Map();
  GL.forEach(e=>{ if(e.scope!=='both'&&e.scope!==track) return; e.a.forEach(a=>{ const vs=[a]; if(e.ci){ vs.push(a.charAt(0).toUpperCase()+a.slice(1)); vs.push(a.charAt(0).toLowerCase()+a.slice(1)); } vs.forEach(v=>{ if(!map.has(v)) map.set(v,e); }); }); });
  const re=new RegExp('(?<![\\w/.-])('+[...map.keys()].sort((a,b)=>b.length-a.length).map(a=>a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![\\w-])','g');
  return {map,re};
}
const LINK={cloud:buildLinker('cloud'), ai:buildLinker('ai')};
function linkTerms(root,track){
  const {map,re}=LINK[track||curTrack], used=new Set();
  root.querySelectorAll('[data-gl]').forEach(box=>{
    const walker=document.createTreeWalker(box,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('code,pre,a,button,svg,.term,.tex,mjx-container,h1,h2,h3,.eyebrow,.chip')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
    const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(node=>{
      const text=node.nodeValue; re.lastIndex=0; let m, last=0, frag=null;
      while((m=re.exec(text))){
        const e=map.get(m[1]); if(!e||used.has(e.i)) continue;
        used.add(e.i); frag=frag||document.createDocumentFragment();
        frag.appendChild(document.createTextNode(text.slice(last,m.index)));
        const b=document.createElement('button'); b.type='button'; b.className='term'; b.dataset.g=e.i; b.textContent=m[1]; frag.appendChild(b);
        last=m.index+m[1].length;
      }
      if(frag){ frag.appendChild(document.createTextNode(text.slice(last))); node.parentNode.replaceChild(frag,node); }
    });
  });
}

/* ---------- animated diagram engine ---------- */
const NS='http://www.w3.org/2000/svg';
function mountDiagram(host, d){
  const W=d.w||780, H=d.h||400, NW=d.nw||126, NH=46;
  const nodes={}; d.nodes.forEach(n=>nodes[n.id]=n);
  const steps=d.steps, edges=new Map();
  const add=(a,b)=>{ if(!edges.has(a+'>'+b)&&!edges.has(b+'>'+a)) edges.set(a+'>'+b,[a,b]); };
  (d.edges||[]).forEach(e=>add(e[0],e[1]));
  steps.forEach(s=>s.p.forEach(path=>{ for(let i=0;i<path.length-1;i++) add(path[i],path[i+1]); }));
  const ek=(a,b)=>edges.has(a+'>'+b)?a+'>'+b:b+'>'+a;
  function clip(a,b,p){ const dx=b.x-a.x, dy=b.y-a.y; if(!dx&&!dy) return {x:a.x,y:a.y};
    const sx=dx?(NW/2+p)/Math.abs(dx):Infinity, sy=dy?(NH/2+p)/Math.abs(dy):Infinity, t=Math.min(sx,sy,1); return {x:a.x+dx*t,y:a.y+dy*t}; }
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(T(d.title))+'">';
  (d.groups||[]).forEach(g=>{ s+='<g class="grp '+(g.k||'')+'"><rect x="'+g.x+'" y="'+g.y+'" width="'+g.w+'" height="'+g.h+'" rx="10"/><text x="'+(g.x+10)+'" y="'+(g.y+16)+'">'+esc(T(g.l))+'</text></g>'; });
  edges.forEach((ab,k)=>{ const A=nodes[ab[0]],B=nodes[ab[1]],p1=clip(A,B,2),p2=clip(B,A,2);
    s+='<line class="edge" data-k="'+k+'" x1="'+p1.x.toFixed(1)+'" y1="'+p1.y.toFixed(1)+'" x2="'+p2.x.toFixed(1)+'" y2="'+p2.y.toFixed(1)+'"/>'; });
  d.nodes.forEach(n=>{ const l=T(n.l), sub=n.s?T(n.s):'';
    s+='<g class="node k-'+n.k+'" data-id="'+n.id+'" transform="translate('+(n.x-NW/2)+','+(n.y-NH/2)+')"><rect width="'+NW+'" height="'+NH+'" rx="8"/><circle class="dot" cx="10" cy="10" r="3.5"/>'+
      '<text class="nl" x="'+NW/2+'" y="'+(sub?20:28)+'">'+esc(l)+'</text>'+(sub?'<text class="ns" x="'+NW/2+'" y="35">'+esc(sub)+'</text>':'')+'</g>'; });
  s+='<g class="pk"></g></svg>';
  const kinds=[...new Set(d.nodes.map(n=>n.k))];
  host.innerHTML='<div class="dia-top"><b>'+esc(T(d.title))+'</b><div class="ctrls"><button class="play" data-a="play">'+esc(u('play'))+'</button><button data-a="prev" aria-label="'+esc(u('prev'))+'">‹</button>'+
    steps.map((_,i)=>'<button class="pill" data-a="go" data-i="'+i+'" aria-label="'+esc(u('step'))+' '+(i+1)+'">'+(i+1)+'</button>').join('')+
    '<button data-a="next" aria-label="'+esc(u('next'))+'">›</button><button class="spd" data-a="spd" aria-label="'+esc(u('speed'))+'">1×</button></div></div><div class="timeline"><i></i></div><p class="swipe">'+esc(u('swipe'))+'</p>'+
    '<div class="dia-svg">'+s+'</div><div class="dia-cap" aria-live="polite"><span class="n"></span><p data-gl></p></div><p class="dia-info">'+esc(u('nodeHint'))+'</p>'+
    '<div class="legend">'+kinds.map(k=>'<span class="k-'+k+'"><i></i>'+kname(k)+'</span>').join('')+'<span style="--kc:var(--pulse)"><i></i>'+(curTrack==='ai'?(state.lang==='ms'?'aliran tensor':'tensor flow'):(state.lang==='ms'?'permintaan / data':'request / data'))+'</span>'+(steps.some(x=>x.async)?'<span style="--kc:var(--k-int)"><i></i>'+(curTrack==='ai'?(state.lang==='ms'?'kecerunan / tak segerak':'gradient / async'):(state.lang==='ms'?'acara tak segerak':'async event'))+'</span>':'')+'</div>';
  const svg=host.querySelector('svg'), wrap=host.querySelector('.dia-svg'), pk=svg.querySelector('.pk'), capN=host.querySelector('.dia-cap .n'), capP=host.querySelector('.dia-cap p'), playBtn=host.querySelector('.play');
  let gen=0, cur=0, playing=false, spd=1;
  const tl=host.querySelector('.timeline i'), info=host.querySelector('.dia-info');
  svg.addEventListener('click',e=>{
    const g=e.target.closest('.node'); if(!g) return; const id=g.dataset.id, n=nodes[id], nb=[];
    svg.querySelectorAll('.node').forEach(x=>x.classList.toggle('sel',x===g));
    svg.querySelectorAll('.edge').forEach(ed=>{ const [a,b]=ed.dataset.k.split('>'); const hit=a===id||b===id; ed.classList.toggle('near',hit); if(hit) nb.push(T(nodes[a===id?b:a].l)); });
    const usedIn=steps.map((st,i)=>st.p.some(p=>p.includes(id))?i+1:0).filter(Boolean);
    info.innerHTML='<b>'+esc(T(n.l))+'</b>'+(n.s?' · '+esc(T(n.s)):'')+(nb.length?' · '+esc(u('connected'))+': '+esc(nb.join(', ')):'')+(usedIn.length?' · '+esc(u('inSteps'))+' '+usedIn.join(', '):'');
  });
  function follow(onN){
    if(wrap.scrollWidth<=wrap.clientWidth+4) return;
    const xs=[...onN].map(id=>nodes[id].x), cx=(Math.min(...xs)+Math.max(...xs))/2, scale=svg.clientWidth/W;
    wrap.scrollTo({left:Math.max(0,cx*scale-wrap.clientWidth/2),behavior:REDUCED?'auto':'smooth'});
  }
  function show(i){
    cur=i; const st=steps[i], onE=new Set(), onN=new Set();
    st.p.forEach(path=>{ path.forEach(n=>onN.add(n)); for(let j=0;j<path.length-1;j++) onE.add(ek(path[j],path[j+1])); });
    svg.querySelectorAll('.edge').forEach(e=>e.classList.toggle('on',onE.has(e.dataset.k)));
    svg.querySelectorAll('.node').forEach(e=>e.classList.toggle('on',onN.has(e.dataset.id)));
    host.querySelectorAll('.pill').forEach((b,j)=>b.classList.toggle('on',j===i));
    capN.textContent=u('step')+' '+(i+1)+' / '+steps.length; capP.innerHTML=fmt(st.t); typeset(capP);
    tl.style.width=((i+1)/steps.length*100)+'%';
    follow(onN);
  }
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  function hop(a,b,g,async){
    return new Promise(res=>{
      const A=nodes[a],B=nodes[b],p1=clip(A,B,0),p2=clip(B,A,0);
      const c=document.createElementNS(NS,'circle'); c.setAttribute('r','6.5'); c.setAttribute('class','packet'+(async?' async':''));
      c.setAttribute('cx',p1.x); c.setAttribute('cy',p1.y); pk.appendChild(c);
      const dur=Math.max(480,Math.hypot(p2.x-p1.x,p2.y-p1.y)*3.4)/spd, t0=performance.now();
      function f(t){
        if(g!==gen){ c.remove(); return res(); }
        const k=Math.min(1,(t-t0)/dur), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
        c.setAttribute('cx',p1.x+(p2.x-p1.x)*e); c.setAttribute('cy',p1.y+(p2.y-p1.y)*e);
        if(k<1) requestAnimationFrame(f);
        else{ c.remove(); const nb=svg.querySelector('.node[data-id="'+b+'"]'); if(nb){ nb.classList.remove('hit'); void nb.getBBox(); nb.classList.add('hit'); } res(); }
      }
      requestAnimationFrame(f);
    });
  }
  async function runStep(i,g){ const st=steps[i]; if(REDUCED) return;
    await Promise.all(st.p.map(async path=>{ for(let j=0;j<path.length-1;j++){ if(g!==gen) return; await hop(path[j],path[j+1],g,st.async); } })); }
  function stopUI(){ playing=false; playBtn.textContent=u('play'); }
  async function playAll(){
    const g=++gen; playing=true; playBtn.textContent=u('stop');
    for(let i=0;i<steps.length;i++){ if(g!==gen) return; show(i); await runStep(i,g); if(g!==gen) return; await wait((REDUCED?3200:1300)/spd); }
    if(g===gen) stopUI();
  }
  function goto(i){ const g=++gen; stopUI(); show(i); runStep(i,g); }
  host.querySelector('.ctrls').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return; const a=b.dataset.a;
    if(a==='play'){ if(playing){ gen++; stopUI(); } else playAll(); }
    else if(a==='next') goto((cur+1)%steps.length);
    else if(a==='prev') goto((cur-1+steps.length)%steps.length);
    else if(a==='go') goto(+b.dataset.i);
    else if(a==='spd'){ spd=spd===1?2:spd===2?0.5:1; b.textContent=(spd===0.5?'0.5':spd)+'×'; }
  });
  show(0);
  if(!REDUCED && 'IntersectionObserver' in window){
    const io=new IntersectionObserver(en=>{ if(en[0].isIntersecting){ io.disconnect(); if(!playing&&gen===0) playAll(); } },{threshold:.5});
    io.observe(host);
  }
}

function updateScore(m){
  const el=document.getElementById('score'); if(!el) return;

function wire(view,m,track){
  view.querySelectorAll('.copy').forEach(b=>b.addEventListener('click',()=>{
    const pre=b.parentNode.querySelector('pre'), txt=pre.innerText;
    const ok=()=>{ b.textContent='✓'; setTimeout(()=>b.textContent='Copy',1400); };
    const fallback=()=>{ const r=document.createRange(); r.selectNodeContents(pre); const s=getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent='Ctrl/⌘+C'; };
    try{ navigator.clipboard.writeText(txt).then(ok,fallback); }catch(e){ fallback(); }
  }));
  view.querySelectorAll('.tabs').forEach(t=>t.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return; state.labMode=b.dataset.mode; save();
    const sec=document.getElementById('lab'); const tmp=document.createElement('div'); tmp.innerHTML=labSection(m); sec.replaceWith(tmp.firstChild);
    const fresh=document.getElementById('lab'); wire(fresh,m,track); linkTerms(fresh,track); typeset(fresh);
  }));
  if(m&&m.quiz){
    view.querySelectorAll('.q').forEach(qEl=>qEl.addEventListener('click',e=>{
      const b=e.target.closest('.opt'); if(!b||b.disabled) return;
      const qi=+qEl.dataset.q, oi=+b.dataset.o, q=m.quiz[qi];
      state.quiz[m.id]=state.quiz[m.id]||{}; state.quiz[m.id][qi]=oi; save();
      qEl.querySelectorAll('.opt').forEach((o,j)=>{ o.disabled=true; if(j===q.a) o.classList.add('right'); else if(j===oi) o.classList.add('wrong'); });
      qEl.insertAdjacentHTML('beforeend',whyHTML(q,oi)); typeset(qEl.lastElementChild); updateScore(m);
    }));
  }
  const dn=view.querySelector('[data-done]');
  if(dn) dn.addEventListener('click',()=>{
    const id=dn.dataset.done; state.done[id]=!state.done[id]; save();
    dn.classList.toggle('done',!!state.done[id]); dn.classList.toggle('primary',!state.done[id]); dn.textContent=state.done[id]?u('done'):u('markDone');
    renderNav(id,track); progress(track);
  });
  view.querySelectorAll('[data-dia]').forEach(h=>{ const k=h.dataset.dia; const d=k==='capstone'?C.capstone.diagram:k==='ai-capstone'?C.aiCapstone.diagram:byId[k].diagram; mountDiagram(h,d); });
  view.querySelectorAll('.worked').forEach(w=>w.addEventListener('click',e=>{
    const b=e.target.closest('[data-wk]'); if(!b) return;
    const lis=[...w.querySelectorAll('li')], prog=w.querySelector('.prog'), stepBtn=w.querySelector('[data-wk="step"]');
    if(b.dataset.wk==='all'){ lis.forEach(li=>li.classList.remove('hid')); prog.textContent=''; stepBtn.textContent=u('stepThrough'); return; }
    let shown=lis.filter(li=>!li.classList.contains('hid')).length;
    if(shown===lis.length||!w.dataset.stepping){ lis.forEach(li=>li.classList.add('hid')); shown=0; w.dataset.stepping='1'; }
    const li=lis[shown]; li.classList.remove('hid'); li.classList.remove('new'); void li.offsetWidth; li.classList.add('new'); shown++;
    prog.textContent=shown+' / '+lis.length; stepBtn.textContent=shown===lis.length?u('again'):u('nextStep'); if(shown===lis.length) delete w.dataset.stepping;
  }));
  view.querySelectorAll('[data-calc]').forEach(h=>{ const f=window.AIW&&window.AIW[h.dataset.calc]; if(f){ try{ f(h); }catch(err){ h.textContent='Calculator failed to load: '+err.message; } } });
}

function buildToc(view){
  const toc=document.getElementById('toc'), heads=[...view.querySelectorAll('.sec > .sec-head h2')];
  if(heads.length<3){ toc.innerHTML=''; return; }
  heads.forEach((h,i)=>{ h.closest('.sec').id='sec-'+(i+1); });
  toc.innerHTML='<b>'+esc(u('onPage'))+'</b>'+heads.map((h,i)=>'<a href="#'+location.hash.slice(1)+'" data-sec="sec-'+(i+1)+'">'+esc(h.textContent.split(':')[0])+'</a>').join('');
  toc.onclick=e=>{ const a=e.target.closest('a'); if(!a) return; e.preventDefault(); document.getElementById(a.dataset.sec).scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'start'}); };
  if('IntersectionObserver' in window){
    if(window.__tocIO) window.__tocIO.disconnect();
    const io=new IntersectionObserver(en=>{ en.forEach(x=>{ if(x.isIntersecting){ toc.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.sec===x.target.id)); } }); },{rootMargin:'-20% 0px -70% 0px'});
    heads.forEach(h=>io.observe(h.closest('.sec'))); window.__tocIO=io;
  }
}

    '<input class="gsearch" id="gq" type="search" placeholder="'+esc(u('searchTerms'))+'" aria-label="'+esc(u('searchTerms'))+'"></header>';
  h+='<div class="glist" id="glist">'+items.map(e=>{ const see=e.see&&byId[e.see]?byId[e.see]:null;
    return '<div class="gitem" data-s="'+esc((e.t+' '+e.a.join(' ')+' '+e.en+' '+e.ms).toLowerCase())+'"><b>'+esc(e.t)+(e.scope==='ai'?' <span class="chip">AI</span>':'')+'</b><p>'+fmt(e[state.lang])+'</p>'+
      '<p class="alt">'+(state.lang==='ms'?'EN: '+fmt(e.en):'BM: '+fmt(e.ms))+'</p>'+(see?'<a href="#'+see.id+'">'+esc(unit(see))+' '+see.num+' · '+esc(T(see.title))+' →</a>':'')+'</div>'; }).join('')+
    '</div><p class="note" id="gnone" hidden>'+esc(u('noTerms'))+'</p>';
  return h;
}

/* ---------- router ---------- */
const side=document.getElementById('side'), scrim=document.getElementById('scrim'), menuBtn=document.getElementById('menuBtn');
function setMenu(open){ side.classList.toggle('open',open); scrim.classList.toggle('open',open); menuBtn.setAttribute('aria-expanded',open); }
menuBtn.addEventListener('click',()=>setMenu(!side.classList.contains('open')));
scrim.addEventListener('click',()=>setMenu(false));
function route(keepScroll){
  hideTip(); chrome();
  const id=location.hash.slice(1), view=document.getElementById('view');
  let active='overview', m=null, track='cloud';
  if(byId[id]){ m=byId[id]; active=id; track=m.track; }
  else if(id==='capstone'){ active=id; track='cloud'; }
  else if(id==='ai'||id==='ai-capstone'){ active=id; track='ai'; }
  else if(id==='glossary'){ active=id; track=state.track; }
  curTrack=track; state.track=track; save();
  view.innerHTML = m ? renderModule(m) : id==='capstone'||id==='ai-capstone' ? renderCapstone(id) : id==='ai' ? renderAIOverview() : id==='glossary' ? renderGlossary() : renderOverview();
  renderNav(active,track); progress(track); wire(view,m,track); if(m) updateScore(m); linkTerms(view,track); typeset(view); buildToc(view);
  const mn=view.querySelector('.mathnote'); if(mn) setTimeout(()=>{ if(!window.MathJax||!window.MathJax.typesetPromise) mn.hidden=false; },6000);
  const gq=document.getElementById('gq');
  if(gq) gq.addEventListener('input',()=>{ const q=gq.value.trim().toLowerCase(); let n=0;
    document.querySelectorAll('#glist .gitem').forEach(el=>{ const ok=!q||el.dataset.s.includes(q); el.hidden=!ok; if(ok) n++; });
    document.getElementById('gnone').hidden=n>0; });
  setMenu(false);
  if(!keepScroll && id) window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>route(false));
route(true);
})();
</script>
